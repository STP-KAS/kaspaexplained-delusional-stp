name: Site checks

on:
  push:
  pull_request:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install checks
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Build and test the current application
        run: |
          npm run setup:testnet
          node scripts/build-public-templates.mjs
          npm run check
          npm run check:public
          npm run check:faucet

      - name: Verify standalone V1 artifact
        run: npm run check:v1 && npm run check:guided

      - name: Check responsive rendered pages
        run: npm run check:render

      - name: Retain visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review
          path: .cache/visual-review/dist-v1
          retention-days: 7
