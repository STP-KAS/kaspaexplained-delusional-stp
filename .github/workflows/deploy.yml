name: Publish education
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check:v1
      - name: Verify educational behavior
        run: node --test tests/models.test.mjs tests/network-diagram.test.mjs tests/money-models.test.mjs tests/coordination.test.mjs
      - run: npm run check:copy
      - run: npm run check:journeys
      - run: npm run check:render
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-v1
      - name: Deploy verified static artifact
        id: deployment
        uses: actions/deploy-pages@v4
